# auto-generated by azrael phase 0 — edit as needed
name: Bug report
description: Something is broken or behaving incorrectly in azrael.
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      content: |
        Thanks for filing a bug. Please fill in the sections below so we can reproduce it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear, concise description of what went wrong.
      placeholder: "azrael crashed when I pressed `k` in the process table…"
    validations:
      required: true

  - type: textarea
    id: what-expected
    attributes:
      label: What you expected
      description: What you expected to happen instead.
      placeholder: "The selected process should receive SIGTERM and the row should mark as stopped."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps to reproduce the bug. Include the exact command, flags, and any input.
      placeholder: |
        1. Run `azrael`
        2. Press `k` on the row for PID 1234
        3. See crash

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Python version, and which agent harness was being monitored."
      placeholder: |
        OS: Ubuntu 24.04 / macOS 15 / Windows 11
        Python: 3.12.4
        Agent: opencode 0.5.1 (systemd user scope)

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Paste any relevant log output, stack trace, or `azrael --debug` output here."
      placeholder: |
        Traceback (most recent call last):
          File "...", line 42, in foo
            bar()
        ...
