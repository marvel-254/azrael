# auto-generated by azrael phase 0 — edit as needed
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "1.8.0"
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: cache poetry
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          # Phase 0: no poetry.lock yet. We cache against pyproject.toml so the
          # step doesn't fail; switch to poetry.lock once the lockfile lands.
          cache-dependency-path: pyproject.toml

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          installer-parallel: true

      - name: install dependencies
        run: poetry install --all-extras --no-interaction

      - name: ruff lint
        run: poetry run ruff check .

      - name: ruff format check
        run: poetry run ruff format --check .

      - name: mypy
        run: poetry run mypy src/azrael

      - name: pytest with coverage
        run: poetry run pytest --cov=azrael --cov-report=xml --cov-report=term

      - name: upload coverage to codecov
        if: env.CODECOV_TOKEN != ''
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false
          verbose: false
