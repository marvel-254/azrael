name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Install dependencies
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry install --no-interaction --all-extras

      - name: Run pytest
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run pytest tests/ --tb=short

      - name: Run ruff check
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run ruff check src/azrael tests/

      - name: Run ruff format
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run ruff format --check src/azrael tests/

      - name: Run mypy
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          poetry run mypy src/azrael
