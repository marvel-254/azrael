name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name. Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run pytest
        run: poetry run pytest tests/ --tb=short

      - name: Run ruff check
        run: poetry run ruff check src/azrael tests/

      - name: Run ruff format
        run: poetry run ruff format --check src/azrael tests/

      - name: Run mypy
        run: poetry run mypy src/azrael