# auto-generated by azrael phase 0 — edit as needed
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to release (e.g. v0.1.0). Leave blank to use latest."
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  POETRY_VERSION: "1.8.0"
  PYINSTALLER_VERSION: "6.10.0"

jobs:
  build:
    name: build (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runs-on: ubuntu-latest
            arch: amd64
            artifact_suffix: linux-amd64
            build_gui: "true"
          - os: ubuntu-24.04-arm
            runs-on: ubuntu-24.04-arm
            arch: arm64
            artifact_suffix: linux-arm64
            build_gui: "false"
          - os: macos-13
            runs-on: macos-13
            arch: amd64
            artifact_suffix: macos-amd64
            build_gui: "false"
          - os: macos-latest
            runs-on: macos-latest
            arch: arm64
            artifact_suffix: macos-arm64
            build_gui: "true"
          - os: windows-latest
            runs-on: windows-latest
            arch: amd64
            artifact_suffix: windows-amd64
            build_gui: "true"

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: install poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true
          installer-parallel: true

      - name: install dependencies
        run: poetry install --all-extras --no-interaction

      - name: install pyinstaller
        run: poetry run pip install pyinstaller==${{ env.PYINSTALLER_VERSION }}

      - name: build CLI binary (azrael)
        run: poetry run pyinstaller --onefile --name azrael --console --clean src/azrael/__init__.py

      - name: build GUI binary (azrael-gui)
        if: matrix.build_gui == 'true'
        run: poetry run pyinstaller --onefile --name azrael-gui --noconsole --clean src/azrael/__init__.py

      - name: upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: azrael-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/azrael*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: create / update github release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/azrael*
          generate_release_notes: true
          fail_on_unmatched_files: false
